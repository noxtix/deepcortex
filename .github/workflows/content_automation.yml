name: Weekly Content Automation

on:
  schedule:
    - cron: '0 0 * * 6' # Runs at 00:00 UTC on Saturday
  workflow_dispatch: # Allows manual triggering from the GitHub UI

permissions:
  contents: write # Need write permissions to commit changes

jobs:
  generate-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Content Generation Script
        run: node scripts/generate_content.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/tools.json content/posts/
          git diff --quiet && git diff --staged --quiet || git commit -m "Automated Content Addition: New Tool and Blog Post [skip ci]"
          git push
